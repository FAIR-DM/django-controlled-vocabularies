name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'controlled_vocabularies/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/tests.yml'
  # No paths filter on pull_request: these checks are ruleset-required, and a
  # path-filtered required check never reports on out-of-scope PRs, blocking merge.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  call-tests:
    uses: django-mvp/shared/.github/workflows/tests.yml@v0.4.1
    with:
      coverage-package: controlled_vocabularies
      django-versions: '["5.2", "6.0"]'
      # test/lint tooling lives in the single (non-optional) dev group plus the
      # mvp-shared test extra. --extras ui installs django-mvp too, so the
      # 013-find-a-vocabulary ui suite (tests/test_ui/) has its dependency;
      # the matrix below runs 3.12/3.13 only, both above the extra's
      # python>=3.12 marker (research.md R6).
      poetry-install-args: '--extras ui'
    secrets: inherit
