name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'controlled_vocabularies/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'
  # No paths filter on pull_request: these checks are ruleset-required, and a
  # path-filtered required check never reports on out-of-scope PRs, blocking merge.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  call-tests:
    uses: django-mvp/shared/.github/workflows/tests.yml@v0.6.0
    with:
      coverage-package: controlled_vocabularies
      # The dev group carries django-mvp as well as the mvp-shared bundle, so the
      # 013-find-a-vocabulary ui suite (tests/test_ui/) has its dependency after the
      # default `uv sync`; the matrix runs 3.12/3.13 only, both above the extra's
      # python>=3.12 marker (research.md R6).
    secrets: inherit
