[tool.poetry]
name = "django-controlled-vocabularies"
version = "0.1.0"
description = "Manage, publish, and consume SKOS controlled vocabularies in Django"
authors = ["Sam Jennings"]
license = "MIT"
readme = "README.md"
packages = [{include = "controlled_vocabularies"}]
homepage = "https://github.com/FAIR-DM/django-controlled-vocabularies"
keywords = ["django", "SKOS", "RDF", "controlled vocabulary", "thesaurus", "research", "FAIR", "metadata"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
# Only actively supported Django releases (family standard). 5.2 LTS + current
# stable; dropping a version is a constitution-level change.
django = ">=5.2"
# Runtime deps that carry the vocabulary model (rdflib for the import/export
# boundary, django-parler for translations) are declared alongside the v0.1 code
# that imports them — deptry fails a declared-but-unused dependency, so the
# born-green scaffold stays lean.
defusedxml = "^0.7.1"
# The RDF parsing boundary (research.md R1). Moved here from the dev group in
# this same commit — T006/skos.py is the first code that imports it at
# runtime (decisions.md D12).
rdflib = "^7.6.0"
# The search-as-you-type endpoint and its form fields (FR-002, FR-015). This
# package's own views.py and forms.py are the code that imports it at runtime
# (research.md, decisions.md D9).
django-tomselect = "^2026.6.2"
# The opt-in browsing front end (013-find-a-vocabulary, FR-012). Optional: the
# core package carries no UI dependency, only controlled_vocabularies/ui/
# imports it (test_ui/test_architecture.py, test_ui/test_packaging.py prove
# the isolation). django-mvp's own floor is Python >=3.12 while this package's
# is 3.11, so the marker makes the extra unavailable there rather than an
# install error. Pinned to the 0.19 line rather than the whole pre-1.0 range:
# a 0.x minor is free to change the browsing page's markup, and this package
# reads that markup in its own tests. The floor is 0.19.2 and not lower: below
# it the shipped search and sort controls render associated with a form only
# the filter action defines (django-mvp#282), so both are inert on a page that
# shows neither a filter nor a create button — which is every page here.
django-mvp = { version = ">=0.19.2,<0.21.0", optional = true, python = ">=3.12" }

[tool.poetry.extras]
ui = ["django-mvp"]

[tool.poetry.group.dev.dependencies]
# Family toolchain bundle; the pin tag is the family-standard version. Ships
# ruff, mypy, deptry, pre-commit, pytest, pytest-django, coverage, django-stubs.
# python marker: the bundle needs >=3.12; the package floor stays 3.11 for
# consumers — dev tooling never ships to them.
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.4.1", extras = ["dev", "test"], python = ">=3.12" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
files = ["controlled_vocabularies"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/", "migrations/", "tests/settings.py"]
mypy_path = "controlled_vocabularies/"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
# The core-only settings, not tests.settings. django-stubs' mypy plugin imports this module to
# build its type information, and the Code Quality job installs the package without the `ui`
# extra — so pointing it at tests.settings, which installs django-mvp's stack, crashes the plugin
# with "Error constructing plugin instance of NewSemanalDjangoPlugin" in CI while passing on any
# machine that happens to have the extra. The types this package exposes are the core's, so the
# core settings are also the right subject.
django_settings_module = "tests.settings_core"
ignore_missing_model_attributes = "True"

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true
# migrations are generated code — never linted or reformatted
exclude = ['docs/', '**/migrations/**']

[tool.ruff.lint]
select = [
    "YTT", "S", "B", "A", "C4", "T10", "SIM", "I", "C90",
    "E", "W", "F", "PGH", "UP", "RUF", "TRY",
]
ignore = [
    "E501",
    "E731",
    "RUF012",
    "TRY003",
    "S308",
    "S311",
    "A003",
    "F403",
    "F405",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "B017", "A001", "RUF059"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "tests.py", "*_tests.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=controlled_vocabularies",
    "--cov-report=html",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = "true"
source = ["controlled_vocabularies"]

[tool.deptry]
extend_exclude = [
    "tests/",
    "docs/",
]

[tool.deptry.per_rule_ignores]
DEP003 = ["controlled_vocabularies"]

# django-mvp installs as `mvp`; without this map deptry looks for a module
# named `django_mvp` and reports every ui/ import as a missing dependency.
[tool.deptry.package_module_name_map]
django-mvp = "mvp"

[tool.forge.conformance]
# The subject of each of these four is not a Python module under
# controlled_vocabularies/ui/, so Article X's mirror rule has nothing to
# check them against: test_architecture.py takes the package boundary as its
# subject, test_boot.py takes the core booting with the UI app absent,
# test_packaging.py takes pyproject.toml, and test_templates.py takes the
# shipped templates directly (013-find-a-vocabulary tasks.md T001, T004).
# Each tests/test_demo/ module below has the same shape of exception: its subject is the demo
# project as a whole — booting, seeding, or being served — not one module under
# controlled_vocabularies/ (013-find-a-vocabulary T015). Listed as exact files rather than a
# directory prefix so a stray new test under tests/test_demo/ is still checked.
non-mirror-paths = [
    "tests/test_ui/test_architecture.py",
    "tests/test_ui/test_boot.py",
    "tests/test_ui/test_packaging.py",
    "tests/test_ui/test_templates.py",
    "tests/test_demo/test_admin.py",
    "tests/test_demo/test_demo.py",
    "tests/test_demo/test_documented_commands.py",
    "tests/test_demo/test_seed.py",
    "tests/test_demo/test_smoke.py",
]
