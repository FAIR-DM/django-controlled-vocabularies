{# @description A menu on a vocabulary's or record's page that downloads it as RDF, one entry per format. #}
{# @prop downloads:list | description:"The formats on offer, each a dict with a label and an href." #}
{% load i18n %}
<c-vars downloads />
<c-mvp.dropdown halign="end" only>
  <c-slot name="button">
    <c-button tabindex="0" role="button" size="sm" icon="download" text="{% trans "Download" %}" only />
  </c-slot>
  <c-menu aria-label="{% trans "Download as RDF" %}" class="w-full" only>
    {% for download in downloads %}
      <c-menu.item text="{{ download.label }}" href="{{ download.href }}" download only />
    {% endfor %}
  </c-menu>
</c-mvp.dropdown>
